name: CI

on:
  push:
  pull_request:

jobs:
  # Job name and matrix are unchanged, so the required checks
  # "test (3.10)", "test (3.11)" and "test (3.12)" keep working.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Efficio with dev tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # Windows and macOS, same Python versions. Named test-os so the Ubuntu names above stay as they are.
  test-os:
    name: test-os (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch
        # macOS wheels on PyPI are CPU/MPS builds; Windows needs the CPU index.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Efficio with dev tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
